name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # - name: Set up Node.js
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: "22"

      - name: Install Dependencies
        run: |
          cd FRONTEND-SMART/monorepo-shared-components
          yarn install # Install dependencies for the ui-admin app

      - name: Build UI Admin
        run: |
          cd FRONTEND-SMART/monorepo-shared-components
          yarn build-ui-admin # Build the UI app (This will generate the output in the build(dist) folder)

      - name: Debug - Check Build Output ui-admin folder
        run: |
          echo "Checking build output ui-admin location..."
          ls -R FRONTEND-SMART/monorepo-shared-components/packages/ui-admin

      - name: Debug - Check Build Output dist folder
        run: |
          echo "Checking build output dist location..."
          ls -R FRONTEND-SMART/monorepo-shared-components/packages/ui-admin/dist

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_FIELD_0D850A903 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "FRONTEND-SMART/monorepo-shared-components/packages/ui-admin" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
          is_static_export: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_FIELD_0D850A903 }}
          action: "close"
